<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Mobile Editor</title>
    
    <!-- Подключаем наш новый файл стилей. Vite сам его обработает -->
    <link rel="stylesheet" href="./src/style.css" />
    
    <!-- Подключение скрипта логики -->
    <script type="module" src="src/main.js" defer></script> 
  </head>
  <body>
    <div id="app">
      <!-- Шапка с кнопками Запуск и Стоп -->
      <div class="header-bar">
        <button class="btn-run" id="run-btn">▶ Запустить код</button>
        <!-- Кнопка Стоп изначально заблокирована, пока код не запущен -->
        <button class="btn-run" id="stop-btn">■ Стоп</button>
      </div>

      <!-- Основная рабочая область -->
      <div class="main-layout">
        
        <!-- Сайдбар -->
        <div id="sidebar">
          <div class="sidebar-title">Файлы</div>
          <button id="add-file-btn">+ Новый файл</button>
          <div id="files-list"></div>
        </div>

        <!-- Редактор кода -->
        <div id="editor-container"></div>
      </div>

      <!-- Консоль -->
      <div id="console-container">
        <div class="console-header">
          <div class="console-title">Консоль вывода:</div>
          <button id="clear-console-btn">Очистить</button>
        </div>
        <div id="console-output"></div>
      </div>

        <!-- Модальное окно создания файла -->
    <dialog id="file-dialog" class="dialog">
      <div class="dialog-title">Создать новый файл</div>
      
      <!-- Контейнер инпута с прижатым .js -->
      <div class="file-input-wrapper">
        <input type="text" id="new-file-name-input" class="file-input" placeholder="Имя файла" />
        <span class="file-extension">.js</span>
      </div>

      <!-- Сюда мы будем выводить ошибки -->
      <div id="dialog-error-msg" class="dialog-error-msg"></div>

      <!-- Кнопки управления -->
      <div class="dialog-actions">
        <button id="dialog-cancel-btn" class="dialog-btn dialog-btn--cancel">Отмена</button>
        <button id="dialog-save-btn" class="dialog-btn dialog-btn--save">Создать</button>
      </div>
    </dialog>
    <dialog id="delete-dialog" class="dialog" style="width: 260px;">
      <div class="dialog-title dialog-title--danger">Удалить файл?</div>
      <div id="delete-dialog-text" class="delete-dialog-text">Вы уверены, что хотите удалить этот файл?</div>
      
      <div class="dialog-actions">
        <button id="delete-cancel-btn" class="dialog-btn dialog-btn--cancel">Отмена</button>
        <button id="delete-confirm-btn" class="dialog-btn dialog-btn--danger">Удалить</button>
      </div>
    </dialog>
  </body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Mobile Editor</title>
    
    <!-- Подключаем наш новый файл стилей. Vite сам его обработает -->
    
    <!-- Подключение скрипта логики --> 
    <script type="module" crossorigin src="/js-mxmp-editor/assets/index-DKJCVt5Q.js"></script>
    <link rel="stylesheet" crossorigin href="/js-mxmp-editor/assets/index-BAoA-KbI.css">
  </head>
  <body>
    <div id="app">
      <!-- Шапка с кнопками Запуск и Стоп -->
      <div class="header-bar">
        <button class="btn-run" id="run-btn">▶ Запустить код</button>
        <!-- Кнопка Стоп изначально заблокирована, пока код не запущен -->
        <button class="btn-run" id="stop-btn" style="background: #a12323; flex: 0; width: 100px; display: none;">■ Стоп</button>
      </div>

      <!-- Основная рабочая область -->
      <div class="main-layout">
        
        <!-- Сайдбар -->
        <div id="sidebar">
          <div class="sidebar-title">Файлы</div>
          <button id="add-file-btn">+ Новый файл</button>
          <div id="files-list"></div>
        </div>

        <!-- Редактор кода -->
        <div id="editor-container"></div>
      </div>

      <!-- Консоль -->
      <div id="console-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          <div class="console-title" style="margin: 0;">Консоль вывода:</div>
          <button id="clear-console-btn" style="background: #2d2d2d; color: #aaa; border: 1px solid #444; padding: 2px 8px; font-size: 11px; cursor: pointer; border-radius: 4px;">Очистить</button>
        </div>
        <div id="console-output"></div>
      </div>

        <!-- Модальное окно создания файла -->
    <dialog id="file-dialog" style="background: #252526; color: white; border: 1px solid #444; border-radius: 6px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 280px;">
      <div style="font-weight: bold; margin-bottom: 12px; font-size: 15px;">Создать новый файл</div>
      
      <!-- Контейнер инпута с прижатым .js -->
      <div style="display: flex; align-items: center; background: #3c3c3c; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; margin-bottom: 15px;">
        <input type="text" id="new-file-name-input" placeholder="Имя файла" style="flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px;" />
        <span style="color: #888; font-family: monospace; font-size: 15px; user-select: none;">.js</span>
      </div>

            <!-- Сюда мы будем выводить ошибки (добавили этот блок) -->
      <div id="dialog-error-msg" style="color: #ff6b6b; font-size: 13px; margin-bottom: 12px; display: none; font-weight: 500;"></div>

      <!-- Кнопки управления -->
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button id="dialog-cancel-btn" style="padding: 6px 12px; background: transparent; color: #aaa; border: none; cursor: pointer;">Отмена</button>
        <button id="dialog-save-btn" style="padding: 6px 12px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Создать</button>
      </div>
    </dialog>
    <dialog id="delete-dialog" style="background: #252526; color: white; border: 1px solid #444; border-radius: 6px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 260px;">
      <div style="font-weight: bold; margin-bottom: 10px; font-size: 15px; color: #ff6b6b;">Удалить файл?</div>
      <div id="delete-dialog-text" style="font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.4;">Вы уверены, что хотите удалить этот файл?</div>
      
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button id="delete-cancel-btn" style="padding: 6px 12px; background: transparent; color: #aaa; border: none; cursor: pointer;">Отмена</button>
        <button id="delete-confirm-btn" style="padding: 6px 12px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Удалить</button>
      </div>
    </dialog>
  </body>
</html>
